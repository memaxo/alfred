# CodeRabbit Configuration for ALFRED
# See: https://docs.coderabbit.ai/reference/configuration

reviews:
  # Global review instructions
  instructions: |
    ALFRED is a personal assistant with strict architectural and performance standards.
    
    **Naming Conventions:**
    - Files, directories, and exports must use single lowercase words (e.g., `remind.ts`, `policy`, `note`)
    - Exceptions: Framework files (`_layout.tsx`, `+not-found.tsx`), UI ergonomics (`use-color-scheme.ts`, `sign-in.tsx`)
    - Domain folders use nouns: `cognitive`, `knowledge`, `learning`, `metrics`, `focus`, `capture`, `synthesis`, `execution`, `reflection`
    - Hot paths use `.hot.ts` suffix (e.g., `transition.hot.ts`)
    - Pure type definitions use `.types.ts` suffix
    
    **Architecture:**
    - Layered pipeline: DB → repo → API → app
    - Import direction: `apps/* → packages/* → packages/type` (never reverse)
    - Never bundle server-only modules (`@alfred/db`, `pg`) into client builds
    - Packages must never import from `apps/*`
    - Use dynamic imports for optional integrations to avoid circular dependencies
    
    **Purity & Performance:**
    - Pure functions: no side effects, deterministic outputs
    - Side effects belong at boundaries (routers, schedulers, DB repos)
    - Performance budgets: transitions <100µs, graph lookups <1ms, fact extraction <10ms, plan generation <100ms
    - Zero allocations in hot loops; prefer `for` loops over `map`/`filter` when performance matters
    - No dependency injection containers; pass dependencies as direct imports
    
    **TypeScript:**
    - Strict mode required; no `any` except JSONB `as any` (documented)
    - Avoid `@ts-expect-error`, `@ts-ignore`, `@ts-nocheck` unless absolutely necessary
    - Use proper type assertions (`as Type`) only after runtime validation
    - Prefer helper functions with explicit return types over inline suppressions
    
    **AI SDK v6:**
    - Always use `convertToModelMessages` from `ai` package (never custom conversion)
    - Use `streamText`, `toUIMessageStreamResponse`, `useChat` hooks
    - Tool parts use `input`/`output`, NOT `args`/`result`
    - Use `z.array(z.unknown()).min(1)` for tRPC UIMessage validation
    
    **Error Handling:**
    - Use `toTRPCError()` for unknown errors
    - Classify errors: `transient` (retryable), `permanent` (non-retryable), `system` (infrastructure)
    - Never expose stack traces, file paths, or internal state to clients
    - Use `isDbConnectionError()` type guard for DB failures in SSR
    
    **Testing:**
    - Use `bun test` (Bun's built-in runner)
    - Prefer integration/E2E tests over narrow unit tests
    - Use `createTestSession` from `@alfred/test-kit/auth` for test sessions
    - Mock dependencies with `mock.module()` before imports

  # Path-based instructions for specific domains
  path_instructions:
    # Pure cognitive layer (no side effects)
    - path: "packages/cognitive/**/*.ts"
      instructions: |
        These are pure state machine transitions. Functions must be:
        - Pure (no side effects, deterministic outputs)
        - Meet performance budgets (<100µs for transitions)
        - Accept timestamps as parameters (never call Date.now() internally)
        - Use single-character names in hot loops (i, n, k, v)
        - Never mutate shared state; return new state objects

    # Knowledge graph (performance critical)
    - path: "packages/knowledge/**/*.ts"
      instructions: |
        Knowledge graph queries must:
        - Complete in <1ms (p99) for hot paths
        - Use PostgreSQL recursive CTEs for graph traversals
        - Push traversal logic to database (minimize data transfer)
        - Use HAMT/BTree/RTree indices for queries
        - Hot paths use `.hot.ts` suffix

    # Database layer (boundary)
    - path: "packages/db/**/*.ts"
      instructions: |
        Database operations must:
        - Use Drizzle query builder (never raw SQL)
        - Complete in <10ms (p99) for all queries
        - Use `db.transaction()` for atomic operations
        - Use `db.batch()` for multiple independent queries
        - Match query predicates to composite indexes
        - Use `as any` for JSONB fields (documented Drizzle limitation)

    # API routers (boundary layer)
    - path: "packages/api/src/routers/**/*.ts"
      instructions: |
        API routers must:
        - Stay thin: validate, check permissions, delegate to services
        - Extract business logic to domain services when >300 lines
        - Use `requirePolicy` for sensitive operations
        - Scope queries by `ctx.session.user.id` (single-user context)
        - Use `toTRPCError()` for unknown errors
        - Never expose internal state to clients

    # Agent tools
    - path: "packages/agent/src/orchestrator/tool/**/*.ts"
      instructions: |
        Agent tools must:
        - Use Zod schemas with `.describe()` for all fields
        - Include `authz: z.string().optional()` in input schemas
        - Wrap existing domain functions (never reimplement)
        - Use scope naming: `<domain>.read` for queries, `<domain>.write` for mutations
        - Require `confirm: true` for dangerous operations
        - Validate content limits before policy checks

    # Web app (client-side)
    - path: "apps/web/src/**/*.{ts,tsx}"
      instructions: |
        Web app code must:
        - Never import server-only modules (`@alfred/db`, `pg`, Node APIs)
        - Use `createServerFn()` for server-only operations
        - Use `createIsomorphicFn()` for server/client differences
        - Use route-level error boundaries with `errorComponent`
        - Handle SSR gracefully (return null/empty data if DB unavailable)
        - Use AI SDK v6 hooks (`useChat`, `useCompletion`, `useObject`)

    # React components
    - path: "**/*.{tsx,jsx}"
      instructions: |
        React components must:
        - Use single-word filenames (exceptions: framework files, UI ergonomics)
        - Keep render logic pure (no side effects in JSX)
        - Stabilize callbacks with `useCallback`
        - Wrap components in `React.memo` when receiving props
        - Support keyboard navigation and ARIA labels
        - Meet performance budgets (<1ms message renders, <16ms animation frames)

    # Test files
    - path: "**/*.{test,spec}.{ts,tsx}"
      instructions: |
        Tests must:
        - Use `bun test` (Bun's built-in runner)
        - Use `createTestSession` from `@alfred/test-kit/auth` for sessions
        - Mock dependencies with `mock.module()` before imports
        - Reset mocks in `beforeEach`
        - Prefer integration/E2E tests over unit tests
        - Use `createTestDb`/`closeTestDb` for DB tests

    # Migration files
    - path: "packages/db/src/migrations/**/*.sql"
      instructions: |
        Migrations must:
        - Use idempotent DDL (`IF NOT EXISTS` / `IF EXISTS`)
        - Follow naming: `NNNN_description.sql` (description is single word)
        - Match composite indexes to repo query predicates
        - Use `CREATE EXTENSION IF NOT EXISTS vector` for vector support
        - Document irreversible effects for non-idempotent operations

  # Path filters (exclude generated/generated files)
  path_filters:
    - "**/*"
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/.next/**"
    - "!**/build/**"
    - "!**/.turbo/**"
    - "!**/coverage/**"
    - "!**/__cassettes__/**"
    - "!**/cassettes/**"
    - "!**/*.lock"
    - "!**/bun.lock"
    - "!**/package-lock.json"
    - "!**/yarn.lock"
    - "!**/pnpm-lock.yaml"
    - "!**/.git/**"
    - "!**/.cursor/**"
    - "!**/.ruler/**"
    - "!**/AGENTS.md"
    - "!**/docs/**/*.md"  # Documentation files (unless reviewing docs changes)

  # Review focus areas
  focus:
    - "bugs"
    - "security"
    - "performance"
    - "accessibility"
    - "type-safety"
    - "architecture"

  # Language-specific settings
  languages:
    typescript:
      # Enforce strict TypeScript practices
      instructions: |
        - No `any` type except JSONB `as any` (must be documented)
        - Avoid type suppressions (`@ts-expect-error`, `@ts-ignore`)
        - Use proper type guards and runtime validation
        - Prefer `as const` over literal types
        - Use `import type` for type-only imports
        - Use `export type` for type-only exports

# Code generation settings (for docstrings, etc.)
code_generation:
  docstrings:
    # TSDoc format for TypeScript files
    path_instructions:
      - path: "**/*.ts"
        instructions: |
          Use TSDoc format with:
          - @param tags for parameters (include type and description)
          - @returns tag for return values (include type and description)
          - @example tag for code examples (especially for public APIs)
          - Focus on behavior, edge cases, and performance characteristics
          - Keep descriptions concise and technical
          - Document performance budgets for hot paths

      - path: "packages/**/*.ts"
        instructions: |
          Package-level documentation must:
          - Explain the domain concept (cognitive, knowledge, learning, etc.)
          - Document pure vs boundary layer separation
          - Include performance budgets for hot paths
          - Document error handling patterns

# Ignore patterns (files CodeRabbit should skip)
ignore:
  - "**/*.md"
  - "**/*.mdx"
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/.next/**"
  - "**/build/**"
  - "**/.turbo/**"
  - "**/coverage/**"
  - "**/__cassettes__/**"
  - "**/cassettes/**"
  - "**/.git/**"
  - "**/.cursor/**"
  - "**/.ruler/**"
  - "**/AGENTS.md"
