[features]
web_search_request = true
rmcp_client = true  # Enable OAuth support for streamable HTTP MCP servers

[mcp_servers.context7]
command = "npx"
args = [ "-y", "@upstash/context7-mcp" ]

[mcp_servers.shadcn]
command = "npx"
args = [ "-y", "shadcn@latest", "mcp" ]

[mcp_servers.better-auth]
url = "https://mcp.chonkie.ai/better-auth/better-auth-builder/mcp"
startup_timeout_sec = 30
tool_timeout_sec = 120

[mcp_servers.linear]
url = "https://mcp.linear.app/mcp"
# OAuth login (recommended): codex mcp login linear
# Bearer token fallback: set LINEAR_MCP_TOKEN env var (format: "Bearer lin_api_...")
bearer_token_env_var = "LINEAR_MCP_TOKEN"
startup_timeout_sec = 30
tool_timeout_sec = 120
