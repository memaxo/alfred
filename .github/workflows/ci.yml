name: CI

on:
  push:
    branches:
      - main
      - dev
      - prod
  pull_request:

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  changes:
    name: Determine Lane
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.meta.outputs.lane }}
      docs_only: ${{ steps.meta.outputs.docs_only }}
      tests_only: ${{ steps.meta.outputs.tests_only }}
      has_db_changes: ${{ steps.meta.outputs.has_db_changes }}
      changed_packages: ${{ steps.meta.outputs.changed_packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select lane
        id: meta
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const core = require('@actions/core');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const eventName = context.eventName;
            const isPR = eventName === 'pull_request';

            const docsRegex = /^(docs\/|README\.md$|[^/]+\.md$|[^/]+\.mdx$|\.ruler\/)/i;
            const testsRegex = /(\.test\.(t|j)sx?$|\.spec\.(t|j)sx?$|__tests__\/)/;
            const dbRegex = /^(packages\/db\/|config\/env\.example$)/;

            const files = [];

            if (isPR) {
              const pull_number = context.payload.number;
              const prFiles = await github.paginate(
                github.rest.pulls.listFiles,
                {
                  owner,
                  repo,
                  pull_number,
                  per_page: 100,
                },
                response => response.data.map(item => item.filename),
              );
              files.push(...prFiles);
            } else if (context.payload.before) {
              const compare = await github.rest.repos.compareCommits({
                owner,
                repo,
                base: context.payload.before,
                head: context.sha,
              });
              for (const file of compare.data.files ?? []) {
                if (file.status !== 'removed') {
                  files.push(file.filename);
                }
              }
            } else {
              const tree = await github.rest.git.getTree({
                owner,
                repo,
                tree_sha: context.sha,
                recursive: '1',
              });
              for (const item of tree.data.tree ?? []) {
                if (item.type === 'blob') {
                  files.push(item.path);
                }
              }
            }

            core.info(`Changed files: ${files.join(', ')}`);

            const hasDocs = files.some(f => docsRegex.test(f));
            const hasTests = files.some(f => testsRegex.test(f));
            const hasDbChanges = files.some(f => dbRegex.test(f));
            const hasRuntime = files.some(f => !docsRegex.test(f) && !testsRegex.test(f));

            const docsOnly = files.length > 0 && files.every(f => docsRegex.test(f));
            const testsOnly = files.length > 0 && files.every(f => testsRegex.test(f));

            const labels = (context.payload.pull_request?.labels ?? []).map(l => l.name);

            let lane = 'full';
            const labelsToRemove = [];

            if (labels.includes('ci:db') || hasDbChanges) {
              lane = 'db';
            } else if (labels.includes('ci:docs')) {
              if (docsOnly && hasDocs) {
                lane = 'docs';
              } else {
                labelsToRemove.push('ci:docs');
              }
            } else if (labels.includes('ci:tests')) {
              if (testsOnly && hasTests && !hasRuntime && !hasDbChanges) {
                lane = 'tests';
              } else {
                labelsToRemove.push('ci:tests');
              }
            }

            if (labels.includes('ci:full')) {
              lane = hasDbChanges ? 'db' : 'full';
            }

            core.info(`Selected lane: ${lane}`);

            if (isPR && labelsToRemove.length > 0) {
              for (const name of labelsToRemove) {
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: context.payload.number,
                    name,
                  });
                  core.info(`Removed mismatched label: ${name}`);
                } catch (error) {
                  core.warning(`Unable to remove label "${name}": ${error.message}`);
                }
              }
            }

            const packageMatches = new Set();
            for (const file of files) {
              const match = file.match(/^(apps\/[^/]+|packages\/[^/]+)/);
              if (match) {
                packageMatches.add(match[1]);
              }
            }

            core.setOutput('lane', lane);
            core.setOutput('docs_only', docsOnly ? 'true' : 'false');
            core.setOutput('tests_only', testsOnly ? 'true' : 'false');
            core.setOutput('has_db_changes', hasDbChanges ? 'true' : 'false');
            core.setOutput('changed_packages', Array.from(packageMatches).join(','));

  ruler:
    name: Ruler Verify
    needs: changes
    uses: ./.github/workflows/ruler-check.yml

  typecheck:
    name: Typecheck
    needs:
      - changes
      - ruler
    if: ${{ needs.changes.outputs.lane == 'full' || needs.changes.outputs.lane == 'db' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.2.18"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck workspace
        run: bun run typecheck:workspace

  tests:
    name: Tests
    needs:
      - changes
      - ruler
    if: ${{ needs.changes.outputs.lane == 'full' || needs.changes.outputs.lane == 'tests' || needs.changes.outputs.lane == 'db' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.2.18"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        env:
          LANE: ${{ needs.changes.outputs.lane }}
          CHANGED_PACKAGES: ${{ needs.changes.outputs.changed_packages }}
        run: |
          set -euo pipefail
          if [[ "$LANE" == "tests" && -n "$CHANGED_PACKAGES" ]]; then
            IFS=',' read -ra packages <<<"$CHANGED_PACKAGES"
            args=()
            for pkg in "${packages[@]}"; do
              if [[ -n "$pkg" ]]; then
                args+=(--filter="$pkg")
              fi
            done
            if [[ "${#args[@]}" -eq 0 ]]; then
              bunx turbo run test
            else
              bunx turbo run test "${args[@]}"
            fi
          else
            bunx turbo run test
          fi

  migrate-dryrun:
    name: DB Dry Run
    needs:
      - changes
      - ruler
      - typecheck
      - tests
    if: ${{ needs.changes.outputs.lane == 'db' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.2.18"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dry-run migrations
        run: bun run db:migrate -- --dry-run
