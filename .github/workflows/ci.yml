name: CI

on:
  push:
    branches:
      - main
      - dev
      - prod
  pull_request:

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  changes:
    name: Determine Lane
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.meta.outputs.lane }}
      docs_only: ${{ steps.meta.outputs.docs_only }}
      tests_only: ${{ steps.meta.outputs.tests_only }}
      has_db_changes: ${{ steps.meta.outputs.has_db_changes }}
      changed_packages: ${{ steps.meta.outputs.changed_packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select lane
        id: meta
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const core = require('@actions/core');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const eventName = context.eventName;
            const isPR = eventName === 'pull_request';

            const docsRegex = /^(docs\/|README\.md$|[^/]+\.md$|[^/]+\.mdx$|\.ruler\/)/i;
            const testsRegex = /(\.test\.(t|j)sx?$|\.spec\.(t|j)sx?$|__tests__\/)/;
            const dbRegex = /^(packages\/db\/|config\/env\.example$)/;

            const files = [];

            if (isPR) {
              const pull_number = context.payload.number;
              const prFiles = await github.paginate(
                github.rest.pulls.listFiles,
                {
                  owner,
                  repo,
                  pull_number,
                  per_page: 100,
                },
                response => response.data.map(item => item.filename),
              );
              files.push(...prFiles);
            } else if (context.payload.before) {
              const compare = await github.rest.repos.compareCommits({
                owner,
                repo,
                base: context.payload.before,
                head: context.sha,
              });
              for (const file of compare.data.files ?? []) {
                if (file.status !== 'removed') {
                  files.push(file.filename);
                }
              }
            } else {
              const tree = await github.rest.git.getTree({
                owner,
                repo,
                tree_sha: context.sha,
                recursive: '1',
              });
              for (const item of tree.data.tree ?? []) {
                if (item.type === 'blob') {
                  files.push(item.path);
                }
              }
            }

            core.info(`Changed files: ${files.join(', ')}`);

            const hasDocs = files.some(f => docsRegex.test(f));
            const hasTests = files.some(f => testsRegex.test(f));
            const hasDbChanges = files.some(f => dbRegex.test(f));
            const hasRuntime = files.some(f => !docsRegex.test(f) && !testsRegex.test(f));

            const docsOnly = files.length > 0 && files.every(f => docsRegex.test(f));
            const testsOnly = files.length > 0 && files.every(f => testsRegex.test(f));

            const labels = (context.payload.pull_request?.labels ?? []).map(l => l.name);

            let lane = 'full';
            const labelsToRemove = [];

            if (labels.includes('ci:db') || hasDbChanges) {
              lane = 'db';
            } else if (labels.includes('ci:docs')) {
              if (docsOnly && hasDocs) {
                lane = 'docs';
              } else {
                labelsToRemove.push('ci:docs');
              }
            } else if (labels.includes('ci:tests')) {
              if (testsOnly && hasTests && !hasRuntime && !hasDbChanges) {
                lane = 'tests';
              } else {
                labelsToRemove.push('ci:tests');
              }
            }

            if (labels.includes('ci:full')) {
              lane = hasDbChanges ? 'db' : 'full';
            }

            core.info(`Selected lane: ${lane}`);

            if (isPR && labelsToRemove.length > 0) {
              for (const name of labelsToRemove) {
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: context.payload.number,
                    name,
                  });
                  core.info(`Removed mismatched label: ${name}`);
                } catch (error) {
                  core.warning(`Unable to remove label "${name}": ${error.message}`);
                }
              }
            }

            const packageMatches = new Set();
            for (const file of files) {
              const match = file.match(/^(apps\/[^/]+|packages\/[^/]+)/);
              if (match) {
                packageMatches.add(match[1]);
              }
            }

            core.setOutput('lane', lane);
            core.setOutput('docs_only', docsOnly ? 'true' : 'false');
            core.setOutput('tests_only', testsOnly ? 'true' : 'false');
            core.setOutput('has_db_changes', hasDbChanges ? 'true' : 'false');
            core.setOutput('changed_packages', Array.from(packageMatches).join(','));

  ruler:
    name: Ruler Verify
    needs: changes
    uses: ./.github/workflows/ruler-check.yml

  preflight:
    name: Pre-flight Checks
    needs:
      - changes
      - ruler
    if: ${{ needs.changes.outputs.lane == 'full' || needs.changes.outputs.lane == 'db' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.2.18"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run pre-flight checks
        run: bun scripts/preflight.ts

  build-verify:
    name: Build Verification
    needs: 
      - changes
      - ruler
    if: ${{ needs.changes.outputs.lane == 'full' || needs.changes.outputs.lane == 'db' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.2.18"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Production Build
        run: bun run verify:build

  typecheck:
    name: Typecheck
    needs:
      - changes
      - ruler
    if: ${{ needs.changes.outputs.lane == 'full' || needs.changes.outputs.lane == 'db' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.2.18"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck workspace
        run: bun run typecheck:workspace

  tests:
    name: Tests
    needs:
      - changes
      - ruler
    if: ${{ needs.changes.outputs.lane == 'full' || needs.changes.outputs.lane == 'tests' || needs.changes.outputs.lane == 'db' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.2.18"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup UV (for Python tests)
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.6.0"
        continue-on-error: true

      - name: Verify Python Environment (fail-fast)
        run: |
          # Check if voice package Python environment is healthy
          # This catches corrupted environments before running expensive tests
          if [ -f packages/voice/scripts/verify-python.ts ]; then
            bun run packages/voice/scripts/verify-python.ts || {
              echo "::error::Python environment is corrupted! See logs for repair instructions."
              exit 1
            }
          fi
        continue-on-error: true

      - name: Run tests
        env:
          LANE: ${{ needs.changes.outputs.lane }}
          CHANGED_PACKAGES: ${{ needs.changes.outputs.changed_packages }}
        run: |
          set -euo pipefail
          if [[ "$LANE" == "tests" && -n "$CHANGED_PACKAGES" ]]; then
            IFS=',' read -ra packages <<<"$CHANGED_PACKAGES"
            args=()
            for pkg in "${packages[@]}"; do
              if [[ -n "$pkg" ]]; then
                args+=(--filter="$pkg")
              fi
            done
            if [[ "${#args[@]}" -eq 0 ]]; then
              bunx turbo run test
            else
              bunx turbo run test "${args[@]}"
            fi
          else
            bunx turbo run test
          fi

      - name: Voice queue + registry tests
        run: bun test apps/native/tests/voice-queue.test.ts packages/voice/test/e2e/session.test.ts

      - name: Verify tmux sessions (default)
        run: bun scripts/verify-sessions.ts
        continue-on-error: true

      - name: Verify tmux sessions (fail mode)
        run: bun scripts/verify-sessions.ts --fail
        continue-on-error: true

      - name: Verify tmux sessions (session crash)
        run: bun scripts/verify-sessions.ts --session-crash
        continue-on-error: true

      - name: Check tmux leaks (best-effort)
        if: always()
        run: bun scripts/check-tmux-leaks.ts
        continue-on-error: true

      - name: Cache VCR cassettes
        uses: actions/cache@v4
        with:
          path: |
            packages/api/test/integration/__cassettes__/**/*.json
            packages/test-kit/cassettes/**/*.json
          key: vcr-cassettes-${{ runner.os }}-${{ hashFiles('**/__cassettes__/**/*.json', '**/cassettes/**/*.json') }}
          restore-keys: |
            vcr-cassettes-${{ runner.os }}-

      - name: Validate VCR cassettes
        run: bun run test:vcr:validate
        continue-on-error: true

      - name: Full integration tests
        run: bun run test:integration:full
        continue-on-error: true

  e2e:
    name: E2E Tests
    needs:
      - changes
      - ruler
    if: ${{ needs.changes.outputs.lane == 'full' || needs.changes.outputs.lane == 'tests' || needs.changes.outputs.lane == 'db' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.2.18"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps

      - name: Run E2E
        run: |
          cd apps/web
          bun run test:e2e:auto

      - name: Run Auth E2E
        run: bunx playwright test apps/web/tests/auth.e2e.spec.ts --config apps/web/playwright.config.ts --project=e2e
        continue-on-error: true

      - name: Run Workflow E2E
        run: bunx playwright test apps/web/tests/workflow-execution.e2e.spec.ts --config apps/web/playwright.config.ts --project=e2e
        continue-on-error: true

      - name: Run Settings E2E
        run: bunx playwright test apps/web/tests/settings.e2e.spec.ts --config apps/web/playwright.config.ts --project=e2e
        continue-on-error: true

      - name: No-DB smoke test
        run: |
          # Test that app can start without database
          # This verifies graceful degradation works
          DATABASE_URL="postgresql://invalid:invalid@localhost:5432/invalid" \
          bun run dev:web &
          SERVER_PID=$!
          sleep 5
          # Check if server started (should not crash)
          if ps -p $SERVER_PID > /dev/null; then
            echo "✅ Server started without DB"
            kill $SERVER_PID || true
          else
            echo "❌ Server crashed when DB unavailable"
            exit 1
          fi
        continue-on-error: true

      - name: Voice streaming session spec (serverless harness)
        run: |
          PLAYWRIGHT_SKIP_WEB_SERVER=1 bunx playwright test apps/web/tests/voice-session.e2e.spec.ts --config apps/web/playwright.config.ts --project=e2e

      - name: Upload E2E test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            apps/web/test-results/**/*
            apps/web/playwright-report/**/*
          retention-days: 7
          if-no-files-found: ignore

  migrate-dryrun:
    name: DB Dry Run
    needs:
      - changes
      - ruler
      - typecheck
      - tests
      - e2e
    if: ${{ needs.changes.outputs.lane == 'db' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.2.18"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dry-run migrations
        run: bun run db:migrate -- --dry-run
