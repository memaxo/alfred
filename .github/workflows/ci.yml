name: CI

on:
  push:
    branches: [main, dev, prod]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.5"
      - run: bun install --frozen-lockfile
      - run: bun x ultracite check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.5"
      - uses: rharkor/caching-for-turbo@v1.7
      - run: bun install --frozen-lockfile
      - run: bunx turbo typecheck

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.5"
      - uses: rharkor/caching-for-turbo@v1.7
      - run: bun install --frozen-lockfile
      - name: Check forbidden generated artifacts
        run: bun run check:artifacts
      - name: Run scoped tests (exclude slow)
        run: bun run test:fast
      - name: Verify client build for server-only leakage
        run: bun run verify:build

  boundaries:
    name: Package Boundaries
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.5"
      - run: bun install --frozen-lockfile
      - name: Run turbo boundaries (non-blocking)
        run: bunx turbo boundaries || true
