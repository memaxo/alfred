name: Cursor Automation

on:
  pull_request:
    types: [opened, synchronize]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  code-review:
    name: AI Code Review
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request != null && github.event.pull_request.head.repo.full_name == github.repository && secrets.CURSOR_API_KEY != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
          command -v cursor-agent || command -v cursor
      - name: Run Code Review
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if command -v cursor-agent >/dev/null 2>&1; then
            cursor-agent \
              --model gpt-5.2 \
              --headless \
              --print \
              "Review the changes in this PR for code quality, bugs, and ALFRED conventions." \
              > review.md || \
            cursor-agent agent \
              --model gpt-5.2 \
              --headless \
              --print \
              "Review the changes in this PR for code quality, bugs, and ALFRED conventions." \
              > review.md
            exit 0
          fi

          cursor agent \
            --model gpt-5.2 \
            --headless \
            --print \
            "Review the changes in this PR for code quality, bugs, and ALFRED conventions." \
            > review.md
      - name: Post Review Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('review.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## AI Code Review\n\n' + review
            });

  autofix-ci:
    name: Auto-fix CI Failures
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run != null && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_repository.full_name == github.repository && secrets.CURSOR_API_KEY != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          export PATH="$HOME/.local/bin:$HOME/.cursor/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
          command -v cursor-agent || command -v cursor || true
      - name: Attempt Auto-fix
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cursor/bin:$PATH"
          if command -v cursor-agent >/dev/null 2>&1; then
            cursor-agent \
              --model gpt-5.2 \
              --headless \
              --yolo \
              "CI failed. Fix type errors and linting issues." || \
            cursor-agent agent \
              --model gpt-5.2 \
              --headless \
              --yolo \
              "CI failed. Fix type errors and linting issues." || true
            exit 0
          elif command -v cursor >/dev/null 2>&1; then
            cursor agent \
              --model gpt-5.2 \
              --headless \
              --yolo \
              "CI failed. Fix type errors and linting issues." || true
          else
            echo "Warning: cursor-agent or cursor not found, skipping auto-fix"
            exit 0
          fi
      - name: Create Fix PR
        if: success()
        uses: peter-evans/create-pull-request@v6
        with:
          title: "fix: Auto-fix CI failures"
          body: "Automated fixes from Cursor CLI (gpt-5.2)"
          branch: autofix/${{ github.event.workflow_run.head_branch }}

  update-docs:
    name: Update Documentation
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request != null && contains(github.event.pull_request.labels.*.name, 'docs:update') && github.event.pull_request.head.repo.full_name == github.repository && secrets.CURSOR_API_KEY != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
          command -v cursor-agent || command -v cursor
      - name: Update Docs
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if command -v cursor-agent >/dev/null 2>&1; then
            cursor-agent \
              --model gpt-5.2 \
              --headless \
              --yolo \
              "Update docs/ to reflect PR changes." || \
            cursor-agent agent \
              --model gpt-5.2 \
              --headless \
              --yolo \
              "Update docs/ to reflect PR changes."
            exit 0
          fi

          cursor agent \
            --model gpt-5.2 \
            --headless \
            --yolo \
            "Update docs/ to reflect PR changes."
