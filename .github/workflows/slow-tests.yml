name: Slow Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # Every day at 2am

jobs:
  slow-tests:
    name: Slow Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.5"
      - uses: rharkor/caching-for-turbo@v1.7
      - run: bun install --frozen-lockfile
      - name: Run slow tests
        run: bun run test:slow:ci
