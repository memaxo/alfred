default_agents = ["agentsmd", "claude", "cursor", "copilot", "aider"]

[settings]
nested = true

[mcp]
enabled = true
merge_strategy = "merge"

[mcp_servers.filesystem]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "."]

[mcp_servers.git]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-git", "--repository", "."]

[agents.agentsmd]
enabled = true
output_path = "AGENTS.md"

[agents.claude]
enabled = true
output_path = "CLAUDE.md"
[agents.claude.mcp]
enabled = true
merge_strategy = "merge"

[agents.cursor]
enabled = true
output_path = ".cursor/rules/ruler_cursor_instructions.mdc"
[agents.cursor.mcp]
enabled = true
merge_strategy = "merge"

[agents.copilot]
enabled = true
output_path = "AGENTS.md"

[agents.aider]
enabled = true
output_path_instructions = "AGENTS.md"
output_path_config = ".aider.conf.yml"
[agents.aider.mcp]
enabled = true

[gitignore]
enabled = true
