default_agents = ["agentsmd"]

[settings]
nested = true

[mcp]
enabled = true
merge_strategy = "merge"

[mcp_servers.filesystem]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "."]

[mcp_servers.git]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-git", "--repository", "."]

[agents.agentsmd]
enabled = true
output_path = "AGENTS.md"

[gitignore]
enabled = true
