# ALFRED Policy Configuration (RBAC + ABAC + Obligations)

roles:
  owner:
    scopes:
      - assistant.read
      - assistant.write
      - assistant.escalate
      - web.read
      - note.read
      - note.write
      - remind.read
      - remind.write
      - timer.read
      - timer.write
      - book.read
      - book.write
      - slack.read
      - slack.write
      - home.read
      - home.write
      - focus.read
      - focus.write
      - orchestrator.read
      - orchestrator.write
      - workflow.plan
      - droid.exec
      - droid.read
      - git.read
      - git.write
      - proxmox.read
      - proxmox.write
      - router.read
      - router.write
      - deploy.read
      - deploy.write
      - linear.read
      - linear.write
      - profile.read
      - profile.write
      - preference.read
      - preference.write
      - privacy.read
      - privacy.write
      - privacy.purge
      - token.issue
      - token.elevate
      - eval.define
      - eval.dataset
      - eval.run

  user:
    scopes:
      - assistant.read
      - assistant.write
      - assistant.escalate
      - web.read
      - note.read
      - note.write
      - remind.read
      - remind.write
      - timer.read
      - timer.write
      - book.read
      - book.write
      - profile.read
      - profile.write
      - preference.read
      - preference.write
      - privacy.read
      - privacy.write
      - privacy.purge

rules:
  - id: token-issue-owner
    actions: ["token.issue"]
    roles: ["owner"]
    effect: "allow"

  - id: assistant-generate
    actions: ["assistant.generate"]
    roles: ["owner", "user"]
    effect: "allow"

  - id: assistant-stream
    actions: ["assistant.stream"]
    roles: ["owner", "user"]
    effect: "allow"

  - id: assistant-escalate
    actions: ["assistant.escalate"]
    roles: ["owner", "user"]
    effect: "allow"

  - id: linear-auth-owner
    actions: ["linear.getAuthorizeUrl", "linear.oauthCallback"]
    roles: ["owner", "user"]
    effect: "allow"

  - id: profile-write
    actions: ["profile.write"]
    roles: ["owner", "user"]
    effect: "allow"

  - id: preference-write
    actions: ["preference.write"]
    roles: ["owner", "user"]
    effect: "allow"

  - id: privacy-purge
    actions: ["privacy.purge"]
    roles: ["owner", "user"]
    effect: "allow"

  - id: allow-droid-exec-owner
    actions: ["droid.exec"]
    roles: ["owner"]
    resource:
      kind: "repo"
    effect: "allow"

  - id: git-read-owner
    actions: ["git.status", "git.diff", "git.fetch"]
    roles: ["owner"]
    effect: "allow"

  - id: git-write-owner
    actions:
      [
        "git.branch.create",
        "git.branch.delete",
        "git.branch.update",
        "git.worktree.add",
        "git.worktree.remove",
        "git.commit",
        "git.push",
        "git.merge",
        "git.reset.hard",
      ]
    roles: ["owner"]
    effect: "allow"

  - id: router-owner
    actions: ["router.register", "router.update", "router.remove"]
    roles: ["owner"]
    effect: "allow"

  - id: docker-owner
    actions:
      [
        "docker.build",
        "docker.run",
        "docker.stop",
        "docker.rm",
        "docker.inspect",
        "docker.logs",
        "docker.wait",
        "docker.exec.probe",
      ]
    roles: ["owner"]
    effect: "allow"

  - id: ticket-owner
    actions: ["ticket.*"]
    roles: ["owner"]
    effect: "allow"

  - id: require-bio-droid-exec-autonomy
    actions: ["droid.exec"]
    roles: ["owner"]
    resource:
      kind: "repo"
    effect: "allow"
    conditions:
      - source: context
        field: auto
        in: ["medium", "high"]
    obligations:
      - requireBio

  - id: workflow-plan-owner
    actions: ["workflow.plan"]
    roles: ["owner"]
    effect: "allow"

  - id: workflow-plan-elevated
    actions: ["workflow.plan"]
    roles: ["owner"]
    effect: "allow"
    conditions:
      - source: context
        field: auto
        in: ["medium", "high"]
    obligations:
      - requireBio

  - id: token-elevate-owner
    actions: ["token.elevate"]
    roles: ["owner"]
    effect: "allow"
    obligations:
      - audit

  - id: home-control-owner
    actions: ["home.control"]
    roles: ["owner"]
    effect: "allow"

  - id: home-control-sensitive-requires-bio
    actions: ["home.control"]
    roles: ["owner"]
    effect: "allow"
    conditions:
      - field: "entity"
        in: ["lock", "garage", "alarm"]
    obligations:
      - requireBio

  - id: deploy-promote-owner
    actions: ["deploy.promote"]
    roles: ["owner"]
    effect: "allow"
    obligations:
      - requireBio
      - requireManual

  - id: deploy-preview-owner
    actions: ["deploy.preview"]
    roles: ["owner"]
    effect: "allow"

  - id: deploy-remove-owner
    actions: ["deploy.remove"]
    roles: ["owner"]
    effect: "allow"

  - id: deploy-health-owner
    actions: ["deploy.health"]
    roles: ["owner"]
    effect: "allow"

  - id: proxmox-power-owner
    actions: ["proxmox.power"]
    roles: ["owner"]
    effect: "allow"

  - id: proxmox-admin-requires-bio
    actions: ["proxmox.admin"]
    roles: ["owner"]
    effect: "allow"
    obligations:
      - requireBio

  - id: eval-define-owner
    actions: ["eval.define"]
    roles: ["owner"]
    effect: "allow"

  - id: eval-dataset-owner
    actions: ["eval.dataset"]
    roles: ["owner"]
    effect: "allow"

  - id: eval-run-owner
    actions: ["eval.run"]
    roles: ["owner"]
    effect: "allow"

scopes:
  - assistant.read
  - assistant.write
  - assistant.escalate
  - assistant.generate
  - assistant.stream
  - web.read
  - note.read
  - note.write
  - remind.read
  - remind.write
  - timer.read
  - timer.write
  - book.read
  - book.write
  - slack.read
  - slack.write
  - home.read
  - home.write
  - focus.read
  - focus.write
  - orchestrator.read
  - orchestrator.write
  - workflow.plan
  - droid.exec
  - droid.read
  - git.read
  - git.write
  - proxmox.read
  - proxmox.write
  - router.read
  - router.write
  - deploy.read
  - deploy.write
  - linear.read
  - linear.write
  - profile.read
  - profile.write
  - preference.read
  - preference.write
  - privacy.read
  - privacy.write
  - privacy.purge
  - token.issue
  - token.elevate
  - eval.define
  - eval.dataset
  - eval.run
