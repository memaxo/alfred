# ALFRED Policy Configuration (RBAC + ABAC + Obligations)
# Simplified for single-user context (Jack is the sole owner)
#
# Architecture:
# 1. Default: Owner can do everything
# 2. Sensitive actions require biometric verification (passkey)
# 3. Deployment requires both biometric + manual confirmation

roles:
  owner:
    scopes:
      # Jack has all scopes - this is a personal assistant
      - "*"

rules:
  # Default allow for owner - covers all non-sensitive actions
  - id: owner-allow-all
    actions: ["*"]
    roles: ["owner"]
    effect: "allow"
    priority: 0

  # ============================================
  # Sensitive Actions Requiring Biometric
  # ============================================

  # Elevated autonomy (medium/high) requires passkey
  - id: require-bio-droid-exec-autonomy
    actions: ["droid.exec"]
    roles: ["owner"]
    resource:
      kind: "repo"
    effect: "allow"
    priority: 10
    conditions:
      - source: context
        field: auto
        in: ["medium", "high"]
    obligations:
      - type: biometric
        reason: workflow_autonomy_passkey
        metadata:
          code: requireBio

  # Workflow planning with elevated autonomy
  - id: workflow-plan-elevated
    actions: ["workflow.plan"]
    roles: ["owner"]
    effect: "allow"
    priority: 10
    conditions:
      - source: context
        field: auto
        in: ["medium", "high"]
    obligations:
      - type: biometric
        reason: workflow_autonomy_passkey
        metadata:
          code: requireBio

  # Token elevation requires audit acknowledgement
  - id: token-elevate-owner
    actions: ["token.elevate"]
    roles: ["owner"]
    effect: "allow"
    priority: 10
    obligations:
      - type: confirmation
        reason: audit_required
        metadata:
          code: audit

  # Sensitive home controls (locks, garage, alarm)
  - id: home-control-sensitive-requires-bio
    actions: ["home.control"]
    roles: ["owner"]
    effect: "allow"
    priority: 10
    conditions:
      - field: "entity"
        in: ["lock", "garage", "alarm"]
    obligations:
      - type: biometric
        reason: secure_home_control
        metadata:
          code: requireBio

  # Production deployments require biometric + manual confirmation
  - id: deploy-promote-owner
    actions: ["deploy.promote"]
    roles: ["owner"]
    effect: "allow"
    priority: 10
    obligations:
      - type: biometric
        reason: deploy_promotion_passkey
        metadata:
          code: requireBio
      - type: confirmation
        reason: deploy_manual_confirmation
        metadata:
          code: requireManual

  # Proxmox admin operations require biometric
  - id: proxmox-admin-requires-bio
    actions: ["proxmox.admin"]
    roles: ["owner"]
    effect: "allow"
    priority: 10
    obligations:
      - type: biometric
        reason: proxmox_admin_passkey
        metadata:
          code: requireBio

# Registered scopes (for reference, owner has "*")
scopes:
  - assistant.read
  - assistant.write
  - assistant.escalate
  - assistant.generate
  - assistant.stream
  - web.read
  - note.read
  - note.write
  - remind.read
  - remind.write
  - timer.read
  - timer.write
  - book.read
  - book.write
  - slack.read
  - slack.write
  - home.read
  - home.write
  - focus.read
  - focus.write
  - orchestrator.read
  - orchestrator.write
  - workflow.plan
  - droid.exec
  - droid.read
  - git.read
  - git.write
  - proxmox.read
  - proxmox.write
  - router.read
  - router.write
  - deploy.read
  - deploy.write
  - linear.read
  - linear.write
  - profile.read
  - profile.write
  - preference.read
  - preference.write
  - privacy.read
  - privacy.write
  - privacy.purge
  - token.issue
  - token.elevate
  - eval.define
  - eval.dataset
  - eval.run
