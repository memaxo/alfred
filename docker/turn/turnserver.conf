# coturn config (ALFRED dev/defaults)
#
# For production:
# - set `external-ip` to your public IP (or NAT mapping)
# - configure TLS certs for 5349 (turns)
# - open UDP relay port range (min-port..max-port) on your firewall
#
# See `docs/guides/webrtc-turn.md`.

realm=alfred
lt-cred-mech
fingerprint

# Listening interfaces
listening-ip=0.0.0.0
relay-ip=0.0.0.0
listening-port=3478
tls-listening-port=5349

# Static dev credentials (change for production)
user=alfred:alfred

# Relay ports (keep this range small for dev)
min-port=49160
max-port=49200

# Logging
no-cli
log-file=stdout
simple-log

# Security defaults
no-tcp-relay
