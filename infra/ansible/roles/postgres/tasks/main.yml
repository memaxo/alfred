---
- name: Ensure backup directory exists
  file:
    path: "{{ postgres_backup_dir }}"
    state: directory
    owner: "{{ alfred_user }}"
    group: "{{ alfred_group }}"
    mode: '0755'

- name: Template backup script
  template:
    src: backup.sh.j2
    dest: "{{ postgres_backup_dir }}/backup.sh"
    owner: "{{ alfred_user }}"
    group: "{{ alfred_group }}"
    mode: '0700'

- name: Set up backup cron job
  cron:
    name: "ALFRED Postgres Backup"
    minute: "0"
    hour: "2"
    job: "{{ postgres_backup_dir }}/backup.sh"
    user: "{{ alfred_user }}"
