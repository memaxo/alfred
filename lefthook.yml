pre-push:
  parallel: true
  commands:
    dev-guard:
      run: bun scripts/dev-guard.ts --check --quiet || true
      skip_fail: true
      # Warn about leaked dev processes but don't block push
      
    typecheck:
      run: |
        UPSTREAM=$(git rev-parse --abbrev-ref --symbolic-full-name @{u} 2>/dev/null || echo "")
        if [ -z "$UPSTREAM" ]; then
          # No upstream set, check changed files since last commit
          bunx turbo typecheck --filter='[HEAD~1]'
        else
          bunx turbo typecheck --filter="[${UPSTREAM}...HEAD]"
        fi
      fail_text: "Type errors found - push blocked"
    
    lint:
      glob: "*.{ts,tsx,js,jsx,json,jsonc}"
      run: bun x ultracite check {push_files} || true
      skip_empty: true
      skip_fail: true
      # Lint issues warn but don't block push
      
    tests:
      run: |
        UPSTREAM=$(git rev-parse --abbrev-ref --symbolic-full-name @{u} 2>/dev/null || echo "")
        FILTER=""
        if [ -z "$UPSTREAM" ]; then
          FILTER="[HEAD~1]"
        else
          FILTER="[${UPSTREAM}...HEAD]"
        fi
        # Aggressively skip slow tests in pre-push using the fast test script
        ALFRED_TEST_SCOPE=unit ALFRED_TEST_TIMEOUT_MS=60000 ALFRED_TEST_WATCHDOG_MS=180000 ALFRED_TEST_RUN_TIMEOUT_MS=180000 ALFRED_TEST_RUNNER_TIMEOUT_MS=210000 bun run test:fast --filter="$FILTER" --concurrency=4 -- --bail=3
      fail_text: "Tests failed - push blocked"

pre-commit:
  commands:
    format:
      glob: "*.{ts,tsx,js,jsx,json,jsonc,css,scss,md,mdx}"
      run: bun x ultracite fix {staged_files}
      stage_fixed: true
      skip_empty: true
