[project]
name = "alfred-embed"
version = "0.1.0"
description = "Local embedding models for ALFRED (KaLM-Embedding-Gemma3-12B-2511)"
requires-python = ">=3.10,<3.14"
dependencies = [
    "sentence-transformers>=3.0.0",
    "huggingface-hub>=0.20.0",
    "numpy>=1.24.0",
    "torch>=2.5.0",
    "bitsandbytes>=0.42.0 ; sys_platform != 'darwin'",
    "accelerate>=0.26.0",
    # Note: ROCm PyTorch is configured via environment variable EMBED_DEVICE=rocm
    # For ROCm builds, use packages/embed/pyproject.rocm.toml or set EMBED_DEVICE=rocm
    # Default uses PyPI torch (works on CPU/MPS/CUDA)
]

# Note: ROCm PyTorch configuration moved to pyproject.rocm.toml
# Use that file for Linux/AMD GPU deployments, or set EMBED_DEVICE=rocm
# Default configuration uses PyPI torch for maximum compatibility

