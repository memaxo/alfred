[project]
name = "alfred-rerank"
version = "0.1.0"
description = "Multimodal reranking service for ALFRED (Qwen3-VL-Reranker)"
requires-python = ">=3.10,<3.14"
dependencies = [
    "transformers>=4.57.0",
    "qwen-vl-utils>=0.0.14",
    "torch>=2.8.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "huggingface-hub>=0.20.0",
    "numpy>=1.24.0",
    "accelerate>=0.26.0",
    "pillow>=10.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
