[project]
name = "alfred-summarize"
version = "0.1.0"
description = "LongCodeZip-based text compression and summarization for ALFRED"
requires-python = ">=3.10,<3.14"
dependencies = [
  # Core ML dependencies
  "torch>=2.5.0",
  "transformers>=4.57.0",
  "huggingface-hub>=0.20.0",
  "numpy>=1.24.0",
  "accelerate>=0.26.0",
  # Quantization for memory efficiency
  "bitsandbytes>=0.42.0 ; sys_platform != 'darwin'",
  # Logging
  "loguru>=0.7.0",
]
