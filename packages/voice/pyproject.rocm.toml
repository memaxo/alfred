[project]
name = "alfred-voice-rocm"
version = "0.1.0"
description = "Voice models dependencies for ALFRED (ROCm/AMD GPU variant)"
requires-python = ">=3.10,<3.14"
dependencies = [
    "nemo_toolkit[asr]>=1.23.0",
    "packaging",
    "silero-vad>=4.0.0",
    "numpy>=1.24.0",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "torchaudio>=2.5.0",
    "transformers>=4.46.0",
    "snac>=1.2.0",
    "soundfile>=0.12.0",
    "accelerate>=0.26.0",
    "termcolor>=2.4.0",
    "ml_dtypes>=0.5.0", 
]

# ROCm sources for AMD GPUs
[tool.uv.sources]
torch = [
    { index = "pytorch-rocm" },
]
torchvision = [
    { index = "pytorch-rocm" },
]
torchaudio = [
    { index = "pytorch-rocm" },
]

# PyTorch ROCm index (rocm6.2 - matches embed package for consistency)
[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.2"
explicit = true
