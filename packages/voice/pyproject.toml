[project]
name = "alfred-voice"
version = "0.1.0"
description = "Voice models dependencies for ALFRED (Faster-Whisper STT, Piper TTS)"
requires-python = ">=3.10,<3.14"
dependencies = [
    "nemo_toolkit[asr]>=1.23.0",
    "packaging",
    "silero-vad>=4.0.0",
    "numpy>=1.24.0",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "torchaudio>=2.5.0",
    "transformers>=4.46.0",
    "snac>=1.2.0",
    "soundfile>=0.12.0",
    "accelerate>=0.26.0",
    "termcolor>=2.4.0",
    "ml_dtypes>=0.5.0",
    # Note: Known datasets/pyarrow compatibility issue
    # - datasets 2.14.4 (from nemo_toolkit) uses PyExtensionType (removed in pyarrow 13.0+)
    # - pyarrow 22.0.0 is required by nemo_toolkit
    # - This incompatibility cannot be resolved by pinning (nemo_toolkit requires pyarrow 22.0.0)
    # - Voice tests will skip if pools fail to initialize due to this issue
    # - Workaround: Use nemo_toolkit without datasets features, or wait for upstream fix
    # Platform-specific dependencies (macOS only for dev)
    "mlx>=0.19.0; sys_platform == 'darwin'",
    "mlx-lm>=0.19.0; sys_platform == 'darwin'",
]

# Note: Cross-platform PyTorch configuration is handled via environment variables
# For macOS development, use standard PyPI packages
# For Linux/ROCm deployment, use packages/voice/pyproject.rocm.toml

