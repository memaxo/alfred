[project]
name = "alfred-voice"
version = "0.1.0"
description = "Voice models dependencies for ALFRED (Faster-Whisper STT, Piper TTS)"
requires-python = ">=3.10"
dependencies = [
    "nemo_toolkit[asr]>=1.23.0",
    "packaging",
    "silero-vad>=4.0.0",
    "numpy>=1.24.0",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "torchaudio>=2.5.0",
    "transformers>=4.46.0",
    "snac>=1.2.0",
    "soundfile>=0.12.0",
    "accelerate>=0.26.0",
    "termcolor>=2.4.0",
    "ml_dtypes>=0.5.0",
    # Platform-specific dependencies
    "bitsandbytes>=0.43.0; sys_platform == 'linux'",
    "mlx>=0.19.0; sys_platform == 'darwin'",
    "mlx-lm>=0.19.0; sys_platform == 'darwin'",
]

# PyTorch index sources - automatically selects based on platform
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]
bitsandbytes = { index = "pytorch-rocm", marker = "sys_platform == 'linux'" }

# PyTorch indexes
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.3"
explicit = true

